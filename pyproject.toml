[project]
name = "stock-model-selection"
version = "0.0.0"
description = "Stock selection models on PIT-safe data from stock-data-center"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.4",
    "ruff>=0.6",
]

[build-system]
requires = ["uv_build>=0.8,<0.12"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config", "--disable-plugin-autoload"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["tests/guards/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "scripts"]
exclude = ["^tests/guards/fixtures/"]
